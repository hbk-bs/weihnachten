            *{

            .garden {
                position: relative;
                width: 100vw;
                height: 100vh;
                background: #0d0031;
                overflow: hidden;
            }
            .text {
                opacity: 1;
                font-family: "Redaction 50", serif;
                font-optical-sizing: auto;
                font-weight: 700;
                font-style: normal;
                font-size: 30px;
                font-weight: bold;
                letter-spacing: 5px;
                line-height: 1.2;
                text-transform: uppercase;
                color: #FFF0C9;
                text-align: center;
                top: 34%;
                position: absolute;
                left: 50%;
                transform: translate(-50%, -50%);
                transition: opacity 2s;
            }
            .redaction-50-bold {
              font-family: "Redaction 50", serif;
              font-weight: 700;
              font-style: normal;
            }
            .moon {
                position: relative;
                left:20px;
                top:20px;
                width: 140px;
                height: 140px;
                border-radius: 50%;
                background:transparent;
                transform: rotateY(180deg);
                box-shadow: 20px 20px 0 0 #fff370;
            }
            .moon {
                animation: shine 2s infinite ease-in-out; 
            }
            @keyframes shine {
                0% {transform: scale(1);}
                50% {transform: scale(1.15);}
                100% {transform: scale(1);}
            }
            .ground {
                position: absolute;
                bottom: 0;
                width: 100%;
                height: 120px;
                background: ivory;
            }
            .cloudtree{
                opacity: 0;
                position: absolute;
                top: 450px;
                right: 5%;
                height: 350px;
                width: 280px;
            }
            .tree{
                position: absolute;
                bottom: 0;
                left: 45%;
                width: 10%;
                height: 250px;
                background: #673200;
                display: block;
            }
            .cloud{
                position: absolute;
                width: 280px;
                height: 100px;
                top:0;
                left: 50%;
                transform: translateX(-50%);
                border-radius:50px;
                background: rgb(49, 91, 75);
            }
            .cloud:before{
                position: absolute;
                content:"";
                width: 120px;
                height: 120px;
                border-radius: 50%;
                background: ivory;
                bottom:30px;
                left:30px;
                display: block;
            }
            .cloud:after{
                position: absolute;
                content:"";
                width: 160px;
                height: 160px;
                border-radius: 50%;
                background: ivory;
                bottom: 20px;
                left:90px;
                display: block;
            }

.campfire {
    position: absolute;
    left: 31.5%;
    bottom: 50px;
    width: 150px;
    height: 160px;
    transform: scale(1);
    transform-origin: bottom left;
    z-index: 2;

.firewood {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 150px;
    height: 60px;
    z-index: 1;
}
.wood {
    width: 100px;
    height: 20px;
    background: #673200;
    position: absolute;
}
.wood1 {
    top: 10px;
    left: 15px;
    transform: rotate(15deg);
}
.wood2 {
    top: 10px;
    left: 35px;
    transform: rotate(-15deg);
}
.wood3 {
    top: 30px;
    left: 60px;
    width: 30px;
    transform: rotate(90deg);
}
.fire {
    position: absolute;
    width: 70px;
    height: 70px;
    bottom: 50px;
    left: 40px;
    background: rgb(255, 110, 58);
    -webkit-border-radius: 100px 0px;
    border-radius: 100px 0px;
    cursor: pointer;
    z-index: 2;
    transform: rotate(-45deg);
    transition: all 0.4s ease;
    animation: sway1 3s ease-in-out infinite;
}
.fire:hover,
.fire2:hover,
.fire3:hover {
    background: #ffb347;
    filter: brightness(1.3);
}
.fire2 {
    position: absolute;
    width: 60px;
    height: 60px;
    bottom: 40px;
    left: 73px;
    background: rgb(255, 110, 58);
    -webkit-border-radius: 100px 0px;
    border-radius: 100px 0px;
    cursor: pointer;
    z-index: 2;
    transform: rotate(-20deg);
    transition: all 0.4s ease;
    animation: sway2 3.4s ease-in-out infinite;
}
.fire3 {
    position: absolute;
    width: 60px;
    height: 60px;
    bottom: 40px;
    left: 16px;
    background: rgb(255, 110, 58);
    -webkit-border-radius: 100px 0px;
    border-radius: 100px 0px;
    cursor: pointer;
    z-index: 2;
    transform: rotate(110deg);
    transition: all 0.4s ease;
    animation: sway3 2.8s ease-in-out infinite;
}
@keyframes sway1 {
    0%, 100% { transform: rotate(-45deg); }
    50% { transform: rotate(-35deg); }
}
@keyframes sway2 {
    0%, 100% { transform: rotate(-20deg); }
    50% { transform: rotate(-10deg); }
}
@keyframes sway3 {
    0%, 100% { transform: rotate(110deg); }
    50% { transform: rotate(120deg); }
}
@media (max-width: 1400px) {
    .campfire { transform: scale(0.95); }
}
@media (max-width: 1200px) {
    .campfire { transform: scale(0.9); }
}
@media (max-width: 900px) {
    .campfire { transform: scale(0.8); }
}
@media (max-width: 700px) {
    .campfire { transform: scale(0.7); }
}
@media (max-width: 520px) {
    .campfire { transform: scale(0.6); }
}

}
.present-lid {
    position: absolute;
    top: -8px;
    left: -4px;
    width: calc(100% + 8px);
    height: 12px;
    background: inherit;
    filter: brightness(1.15);
}
.present-ribbon {
    position: absolute;
    width: 10px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #F7D98A;
}
.present-bow {
    display: block;
    position: absolute;
    width: 0;
    height: 0;
    top: -85px;
    left: 50%;
    transform: translateX(-50%) scale(var(--heart-scale));
